name: Weekly Review Pulse Trigger

on:
  schedule:
    # 10:00 AM IST (India Standard Time) is 4:30 AM UTC. Runs every Monday.
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      product:
        description: 'Product name (e.g., groww)'
        required: true
        default: 'groww'
        type: string
      start_date:
        description: 'Start date in YYYY-MM-DD format (leave blank for start of previous week)'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date in YYYY-MM-DD format (leave blank for end of previous week)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (generate report but skip Google Docs/Gmail delivery)'
        required: true
        default: false
        type: boolean
      recipients:
        description: 'Comma-separated recipient emails (leave empty to use backend default)'
        required: false
        default: ''
        type: string

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Impullse Run
        run: |
          # Determine parameters based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PRODUCT="${{ github.event.inputs.product }}"
            START_DATE="${{ github.event.inputs.start_date }}"
            END_DATE="${{ github.event.inputs.end_date }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            RECIPIENTS="${{ github.event.inputs.recipients }}"
          else
            # Scheduled run defaults
            PRODUCT="groww"
            START_DATE=""
            END_DATE=""
            DRY_RUN="false"
            RECIPIENTS=""
          fi

          # Construct the JSON payload using jq
          PAYLOAD=$(jq -n \
            --arg prod "$PRODUCT" \
            --arg sd "$START_DATE" \
            --arg ed "$END_DATE" \
            --argjson dr "$DRY_RUN" \
            --arg rec "$RECIPIENTS" \
            '{
              product: $prod,
              start_date: (if $sd == "" then null else $sd end),
              end_date: (if $ed == "" then null else $ed end),
              dry_run: $dr,
              recipients: (if $rec == "" then null else $rec end)
            }')

          echo "Triggering API run with payload: $PAYLOAD"

          # Send POST request to Railway backend
          curl -f -sS -X POST "https://imppulse-production.up.railway.app/api/run" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
